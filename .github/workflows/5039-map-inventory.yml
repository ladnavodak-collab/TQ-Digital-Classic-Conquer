name: 5039 Installer Read-Only Map Inventory
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/inventory_5039_installer.py'
      - '.github/workflows/5039-map-inventory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test archive listing parser\n        run: python3 -m unittest discover -s tests -p test_5039_installer_inventory.py -v
      - name: Install read-only archive lister
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Download historical 5039 installer to temporary runner
        shell: bash
        run: |
          set -euo pipefail
          url='https://archive.org/download/conquer-online-v5039/Conquer_v5039.exe'
          curl --fail --location --show-error --silent --retry 2 --retry-delay 5 \
            --max-time 600 --max-filesize 500000000 "$url" -o /tmp/Conquer_v5039.exe
          test "$(stat -c%s /tmp/Conquer_v5039.exe)" -eq 456150213
          file /tmp/Conquer_v5039.exe
          sha256sum /tmp/Conquer_v5039.exe | cut -d' ' -f1
      - name: List archive contents without executing installer
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inventory_5039_installer.py /tmp/Conquer_v5039.exe
          rm -f /tmp/Conquer_v5039.exe
      - name: Preserve metadata listing only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-5039-map-filenames-only
          path: client-5039-map-inventory.json
          if-no-files-found: ignore
          retention-days: 7
