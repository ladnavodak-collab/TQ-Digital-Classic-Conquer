name: COPS database hardening compilation
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/patch_cops_db_startup.py'
      - '.github/workflows/cops-db-startup-build.yml'
permissions:
  contents: read
jobs:
  patched-cops:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git build-essential qtbase5-dev qt5-qmake libqt5sql5-mysql
      - name: Apply hardening patches
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cptsky42/COPS-v7-Emulator.git upstream-cops
          git -C upstream-cops rev-parse HEAD | tee upstream-commit.txt
          python3 tools/patch_cops_bounds.py upstream-cops
          python3 tools/patch_cops_dh_validation.py upstream-cops
          python3 tools/patch_cops_db_startup.py upstream-cops
          git -C upstream-cops diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path("upstream-cops/src/server.cpp").read_text()
          d=Path("upstream-cops/src/Database/database.cpp").read_text()
          assert 'getenv("COPS_SQL_PASSWORD")' in s
          assert 'qPrintable(getSqlCommand(query))' not in d
          PY
      - name: Compile
        shell: bash
        run: |
          set -o pipefail
          cd upstream-cops
          qmake "COPS v7 Emulator.pro" CONFIG+=release
          make -j2 2>&1 | tee ../build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-guard-build-log
          path: |
            upstream-commit.txt
            build.log
          retention-days: 7
          if-no-files-found: ignore
