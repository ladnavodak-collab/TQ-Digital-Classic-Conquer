name: COPS disposable database and startup smoke
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cops-db-smoke.yml'
      - 'docs/COPS-DATABASE-SMOKE.md'
      - 'tools/patch_cops_startup_gate.py'
      - 'tools/patch_cops_dmap_bounds.py'
      - 'tools/patch_cops_dh_trivial_keys.py'
      - 'tests/test_cops_dh_trivial_keys.py'
      - 'tools/make_synthetic_cops_dmap.py'
      - 'tests/test_synthetic_cops_dmap.py'
      - 'tools/cops_loopback_session_probe.py'
      - 'tools/cops_account_cipher_probe.py'
      - 'tools/cops_account_success_probe.py'
      - 'tools/cops_game_dh_proof_probe.py'
      - 'tools/cops_game_ticket_redemption_probe.py'
      - 'tools/cops_live_character_register.py'
      - 'tools/cops_existing_character_relogin.py'
      - 'tools/cops_world_entry_probe.py'
      - 'tools/cops_walk_persistence_probe.py'
      - 'tests/test_cops_walk_persistence_probe.py'
      - 'tests/test_cops_world_entry_probe.py'
      - 'tests/test_cops_existing_character_relogin.py'
      - 'tests/test_cops_live_character_register.py'
      - 'db/ci_starting_points.sql'
      - 'tests/test_cops_game_ticket_redemption_probe.py'
      - 'tests/test_cops_game_dh_proof_probe.py'
      - 'tools/cops_game_challenge_probe.py'
      - 'tests/test_cops_game_challenge_probe.py'
      - 'tests/cops_game_challenge_decrypt.cpp'
      - 'tools/cops_game_dh_probe.py'
      - 'tests/test_cops_game_dh_probe.py'
      - 'tests/test_cops_account_success_probe.py'
      - 'tests/test_cops_account_cipher_probe.py'
      - 'tools/patch_cops_receive_cleanup.py'
      - 'tools/patch_cops_account_fields.py'
      - 'tools/patch_cops_transfer_tickets.py'
      - 'tools/patch_cops_character_load.py'
      - 'tools/patch_cops_classic_creation.py'
      - 'tools/patch_cops_registration_ticket.py'
      - 'tests/test_cops_registration_ticket.py'
      - 'tests/test_cops_classic_creation.py'
      - 'tests/test_cops_character_load.py'
      - 'tests/test_cops_transfer_tickets.py'
      - 'db/ci_character_schema.sql'
      - 'tools/cops_character_sql_roundtrip.py'
      - 'tests/test_cops_character_sql_schema.py'
      - 'tests/cops_transfer_tickets_qt.cpp'
      - 'tests/test_cops_account_fields.py'
      - 'tests/test_cops_receive_cleanup.py'
      - 'tools/cops_truncated_prelogin_probe.py'
      - 'tests/test_cops_loopback_session_probe.py'
      - 'db/ci_loader_schema.sql'
permissions:
  contents: read
jobs:
  startup-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic DMap fixture checksums
        run: python3 -m unittest discover -s tests -p test_synthetic_cops_dmap.py -v
      - name: Test local prelogin connection probe
        run: python3 -m unittest discover -s tests -p test_cops_loopback_session_probe.py -v
      - name: Unit-test truncated receive cleanup
        run: python3 -m unittest discover -s tests -p test_cops_receive_cleanup.py -v
      - name: Validate bounded account packet fields
        run: python3 -m unittest discover -s tests -p test_cops_account_fields.py -v
      - name: Unit-test transfer ticket patch anchors
        run: python3 -m unittest discover -s tests -p test_cops_transfer_tickets.py -v
      - name: Validate COPS character SQL positional schema
        run: python3 -m unittest discover -s tests -p test_cops_character_sql_schema.py -v
      - name: Validate COPS character loading source patch
        run: python3 -m unittest discover -s tests -p test_cops_character_load.py -v
      - name: Unit-test actual COPS classic creation patch
        run: python3 -m unittest discover -s tests -p test_cops_classic_creation.py -v
      - name: Test role creation transfer-ticket authorization
        run: python3 -m unittest discover -s tests -p test_cops_registration_ticket.py -v
      - name: Test COPS account-port cipher vectors and packet construction
        run: python3 -m unittest discover -s tests -p test_cops_account_cipher_probe.py -v
      - name: Validate account protocol fixtures
        run: python3 -m unittest discover -s tests -p test_cops_account_success_probe.py -v
      - name: Test bounded game-port DH challenge parser
        run: python3 -m unittest discover -s tests -p test_cops_game_dh_probe.py -v
      - name: Unit-test game-port DH challenge parser
        run: python3 -m unittest discover -s tests -p test_cops_game_challenge_probe.py -v
      - name: Validate DH degenerate-key rejection patch
        run: python3 -m unittest discover -s tests -p test_cops_dh_trivial_keys.py -v
      - name: Validate Blowfish CFB64 and game proof parser
        run: python3 -m unittest discover -s tests -p test_cops_game_dh_proof_probe.py -v
      - name: Validate DH response construction and extended Blowfish test vectors
        run: python3 -m unittest discover -s tests -p test_cops_game_ticket_redemption_probe.py -v
      - name: Validate classic registration packet and continuing game cipher
        run: python3 -m unittest discover -s tests -p test_cops_live_character_register.py -v
      - name: Unit test real saved-character login packet decoding
        run: python3 -m unittest discover -s tests -p test_cops_existing_character_relogin.py -v
      - name: Unit-test encrypted game map entry and packet framing
        run: python3 -m unittest discover -s tests -p test_cops_world_entry_probe.py -v
      - name: Validate encrypted walk packet and CFB64 continuation
        run: python3 -m unittest discover -s tests -p test_cops_walk_persistence_probe.py -v
      - name: Install server dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb git build-essential qtbase5-dev qt5-qmake libqt5sql5-mysql libsodium-dev mariadb-server mariadb-client
      - name: Check out and harden upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/cptsky42/COPS-v7-Emulator.git upstream-cops
          git -C upstream-cops rev-parse HEAD | tee upstream-commit.txt
          python3 tools/patch_cops_bounds.py upstream-cops
          python3 tools/patch_cops_dh_validation.py upstream-cops
          python3 tools/patch_cops_dh_trivial_keys.py upstream-cops
          python3 tools/patch_cops_db_startup.py upstream-cops
          python3 tools/patch_cops_argon2id.py upstream-cops
          python3 tools/patch_cops_startup_gate.py upstream-cops
          python3 tools/patch_cops_dmap_bounds.py upstream-cops
          python3 tools/patch_cops_receive_cleanup.py upstream-cops
          python3 tools/patch_cops_account_fields.py upstream-cops
          python3 tools/patch_cops_transfer_tickets.py upstream-cops
          python3 tools/patch_cops_character_load.py upstream-cops
          python3 tools/patch_cops_classic_creation.py upstream-cops
          python3 tools/patch_cops_registration_ticket.py upstream-cops
          grep -q 'TransferTickets::instance().consume' upstream-cops/src/Network/msgconnect.cpp
          grep -q 'mgr.getMap(1002) == nullptr' upstream-cops/src/server.cpp
          grep -q '16000000ULL' upstream-cops/src/Map/mapdata.cpp
          git -C upstream-cops diff --check
      - name: Test real QtCore token issue, consume, replay and invalidation
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -fPIC -no-pie $(pkg-config --cflags Qt5Core) -Iupstream-cops/src/Network tests/cops_transfer_tickets_qt.cpp -o transfer-ticket-test $(pkg-config --libs Qt5Core)
          ./transfer-ticket-test
      - name: Build original COPS Blowfish challenge decoder
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++11 -fPIC -no-pie $(pkg-config --cflags Qt5Core) -Iupstream-cops/src -Iupstream-cops/src/Common -Iupstream-cops/src/Security/Cryptography             tests/cops_game_challenge_decrypt.cpp             upstream-cops/src/Security/Cryptography/blowfish.cpp             -o cops-challenge-decode $(pkg-config --libs Qt5Core)
      - name: Compile real COPS executable
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-cops
          qmake "COPS v7 Emulator.pro" CONFIG+=release
          make -j2 > ../cops-build.log 2>&1 || { tail -n 90 ../cops-build.log; exit 1; }
          test -x "./COPS v7 Emulator"
      - name: Set up disposable MariaDB least-privilege account
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start mariadb
          db_password="$(openssl rand -hex 24)"
          # Never show or upload credentials; this file is deleted after smoke checks.
          umask 077
          printf 'COPS_SQL_PASSWORD=%s\n' "$db_password" > "$RUNNER_TEMP/cops-ci.env"
          sudo mariadb -e "CREATE DATABASE tq_ci; CREATE USER 'tq_ci'@'localhost' IDENTIFIED BY '$db_password'; GRANT SELECT,INSERT,UPDATE,DELETE ON tq_ci.* TO 'tq_ci'@'localhost';"
          mariadb --host=127.0.0.1 --user=tq_ci --password="$db_password" -e "SELECT 1" tq_ci > /dev/null
      - name: Test actual COPS startup failure modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p startup-smoke
          cp "upstream-cops/COPS v7 Emulator" startup-smoke/
          cat > startup-smoke/settings.cfg <<'CFG'
          [COPS_EMULATOR]
          NAME = TQ-CI
          SERVER_IP = 127.0.0.1
          SQL_HOST = 127.0.0.1
          SQL_DB = tq_ci
          SQL_USER = tq_ci
          CFG
          cd startup-smoke
          # A missing database secret must be rejected before anything is served.
          set +e
          timeout 8s "./COPS v7 Emulator" > guard-output.log 2>&1
          guard_code=$?
          set -e
          if [ "$guard_code" -eq 0 ] || [ "$guard_code" -eq 124 ]; then
            echo "FAIL: missing database secret did not fail closed"
            exit 1
          fi
          grep -q "Refusing unsafe database configuration" guard-output.log || {
            echo "FAIL: missing-secret guard message absent"; exit 1;
          }
          echo "PASS: missing secret rejected by real COPS executable"
          # Provide a disposable secret; this step is diagnostic, not a
          # playability assertion. Empty DB and missing maps are expected.
          source "$RUNNER_TEMP/cops-ci.env"
          export COPS_SQL_PASSWORD
          set +e
          timeout 8s "./COPS v7 Emulator" > database-attempt.log 2>&1
          connect_code=$?
          set -e
          echo "Database attempt exit code: $connect_code"
          if grep -q "Refusing unsafe database configuration" database-attempt.log; then
            echo "FAIL: injected secret was refused by config guard"
            exit 1
          fi
          if grep -q "AccServer listening" database-attempt.log || grep -q "MsgServer listening" database-attempt.log; then
            echo "FAIL: reported listeners before game data loaded"
            exit 1
          fi
          if [ "$connect_code" -eq 0 ] || [ "$connect_code" -eq 124 ]; then
            echo "FAIL: empty game database did not fail startup"
            exit 1
          fi
          echo "PASS: incomplete world data fails before binding any game listeners"
          echo "INFO: no real login or client interaction was attempted"
      - name: Probe COPS startup with original synthetic map 1002
        shell: bash
        run: |
          set -euo pipefail
          # This is an original testing-only grid, not official Twin City.
          python3 tools/make_synthetic_cops_dmap.py startup-smoke
          sudo mariadb tq_ci < db/ci_loader_schema.sql
          sudo mariadb tq_ci < db/ci_character_schema.sql
          sudo mariadb tq_ci < db/ci_starting_points.sql
          python3 tools/cops_account_success_probe.py seed sudo mariadb tq_ci
          sudo mariadb tq_ci -e "INSERT INTO \`map\` (id,doc_id,type,weather,portal_x,portal_y,reborn_map,reborn_portal,light) VALUES (1002,1002,0,0,0,0,1002,0,0)"
          source "$RUNNER_TEMP/cops-ci.env"
          export COPS_SQL_PASSWORD
          cd startup-smoke
          # Start COPS in the background. The Python probe checks the actual
          # TCP connection lifecycle and observes the pre-login game handshake.
          ulimit -c unlimited
          stdbuf -oL -eL "./COPS v7 Emulator" > synthetic-attempt.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          set +e
          python3 ../tools/cops_loopback_session_probe.py --attempts 3 --wait-seconds 12
          probe_code=$?
          set -e
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo "FAIL: COPS process crashed or exited during connection handling"
            probe_code=1
          fi
          if [ "$probe_code" -ne 0 ]; then
            echo "Startup diagnostics (filtered):"
            grep -Ei 'abort|error|failed|missing|Could not|not found|listening' synthetic-attempt.log | tail -n 25 || true
            exit 1
          fi
          python3 ../tools/cops_truncated_prelogin_probe.py
          python3 ../tools/cops_account_cipher_probe.py
          python3 ../tools/cops_account_success_probe.py probe
          python3 ../tools/cops_game_dh_proof_probe.py
          python3 ../tools/cops_game_ticket_redemption_probe.py
          python3 ../tools/cops_live_character_register.py register
          python3 ../tools/cops_existing_character_relogin.py
          python3 ../tools/cops_world_entry_probe.py
          set +e
          python3 ../tools/cops_walk_persistence_probe.py move
          walk_code=$?
          set -e
          if [ "$walk_code" -ne 0 ]; then
            echo "Walk diagnostic: game server failed while processing authenticated movement"
            grep -Ei 'segmentation|assert|fatal|error|failed' synthetic-attempt.log | tail -n 25 || true
            echo "CI core pattern: $(cat /proc/sys/kernel/core_pattern)"
            for crash_core in core core.*; do
              if [ -f "$crash_core" ]; then
                gdb --batch -ex 'set pagination off' -ex 'thread apply all bt 14' "./COPS v7 Emulator" "$crash_core" 2>&1 | tail -n 130 || true
              fi
            done
            exit "$walk_code"
          fi
          python3 ../tools/cops_walk_persistence_probe.py check-db sudo mariadb tq_ci
          python3 ../tools/cops_world_entry_probe.py --expected-x 9 --expected-y 8
          python3 ../tools/cops_game_challenge_probe.py ../cops-challenge-decode
          python3 ../tools/cops_game_dh_probe.py
          if ! kill -0 "$server_pid" 2>/dev/null; then
            echo "FAIL: COPS exited after truncated pre-login packets"
            exit 1
          fi
          echo "PASS: test-only COPS server survived multiple pre-auth client connections and disconnects"
      - name: Verify character actually created by authenticated COPS game packet
        shell: bash
        run: python3 tools/cops_live_character_register.py check-db sudo mariadb tq_ci
      - name: Verify MariaDB character create/save/reload and classic limits
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/cops_character_sql_roundtrip.py sudo mariadb tq_ci
      - name: Remove disposable credential file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/cops-ci.env"
      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cops-startup-diagnostics
          path: |
            upstream-commit.txt
            cops-build.log
            startup-smoke/guard-output.log
            startup-smoke/database-attempt.log
            startup-smoke/synthetic-attempt.log
          retention-days: 7
          if-no-files-found: ignore
